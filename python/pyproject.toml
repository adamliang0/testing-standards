[project]
name = "testing-standards-python"
version = "0.1.0"
description = "Reference implementations for Python engineering standards"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "hypothesis>=6",
  "ty",
]

[tool.pytest.ini_options]
testpaths = ["testing/tests", "mutability/tests", "exceptions/tests"]
addopts = "-ra --strict-markers"

[tool.ty.environment]
extra-paths = ["./stubs", "./packaging/examples/sample_project/src"]

[tool.coverage.run]
source = ["testing/examples", "typing/examples", "mutability/examples", "exceptions/examples"]
