[project]
name = "testing-standards-python"
version = "0.1.0"
description = "Reference implementations for Python testing and typing standards"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "hypothesis>=6",
  "ty",
]

[tool.pytest.ini_options]
testpaths = ["testing/tests"]
addopts = "-ra --strict-markers"

[tool.ty.environment]
extra-paths = ["./stubs"]

[tool.coverage.run]
source = ["testing/examples", "typing/examples"]
