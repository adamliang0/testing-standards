[project]
name = "sample-tools"
version = "0.1.0"
description = "Installable and typed CLI packaging reference"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sample-label = "sample_tools.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ty.environment]
extra-paths = ["./src"]
